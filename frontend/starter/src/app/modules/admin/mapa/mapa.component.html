<monitor-toolbar title="Mapa del sistema" [snapshot]="snapshot" [filters]="filters" [connections]="activarConexiones" (changed)="render()" (refresh)="comprobar()" (fit)="fit()" (toggle)="conexiones($event)" (connect)="connect($event)"></monitor-toolbar>
<p class="monitor-empty" *ngIf="snapshot && !iconos.length">No hay nodos visibles con coordenadas válidas.</p>
<div class="monitor-canvas"><div id="map" monitorCanvasNavigation aria-label="Mapa de nodos y conexiones"></div></div>
