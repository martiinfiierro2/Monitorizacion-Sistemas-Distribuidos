<div class="contenedor-grafo">
    <div class="cabecera">
        <p class="cabecera-texto"><strong>FILTROS</strong></p>

        <ul class="cabecera-lista">
            <li>
                <div class="checkbox">
                    <mat-checkbox checked (change)="conexiones($event)" id="conexiones">
                        {{ activarConexiones ? 'Conexiones activadas' : 'Conexiones desactivadas' }}
                    </mat-checkbox>
                </div>
            </li>
            <li>
                <div class="checkbox">
                    <mat-checkbox (change)="mapa($event)" id="conexiones">Activar Mapa</mat-checkbox>
                </div>
            </li>
        </ul>
    </div>
        
    <div id="grafo" [hidden]="activarMapa" class="grafo-fondo" style="width: 100%; height: 600px;"></div>

    <div id="mapa" [hidden]="!activarMapa" class="grafo-fondo" style="width: 100%; height: 600px;"></div>
</div>
