<monitor-toolbar title="Topología del sistema" [snapshot]="snapshot" [filters]="filters" [connections]="activarConexiones" (changed)="render()" (refresh)="comprobar()" (fit)="fit()" (toggle)="conexiones($event)" (connect)="connect($event)"></monitor-toolbar>
<p class="monitor-empty" *ngIf="snapshot && !selectedNodes.length">No hay nodos visibles con los filtros seleccionados.</p>
<div class="monitor-canvas" [style.min-height.px]="layoutHeight"><div id="grafo" #chart aria-label="Grafo de nodos y conexiones"></div></div>
