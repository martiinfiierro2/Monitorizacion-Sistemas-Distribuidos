<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-content-wrapper">
      <mat-nav-list class="icon-nav-list">
        <a mat-list-item aria-label="Grafo" title="Grafo" routerLink="/grafo" routerLinkActive="active">
          <mat-icon svgIcon="mat_outline:bubble_chart"></mat-icon>
        </a>
        <a mat-list-item aria-label="Catálogo" title="Catálogo" routerLink="/lista" routerLinkActive="active">
          <mat-icon svgIcon="mat_outline:list"></mat-icon>
        </a>
        <a mat-list-item aria-label="Mapa" title="Mapa" routerLink="/mapa" routerLinkActive="active">
          <mat-icon svgIcon="mat_outline:map"></mat-icon>
        </a>
      </mat-nav-list>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="main-container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
